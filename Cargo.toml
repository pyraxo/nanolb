[package]
name = "nanolb"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query", "multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-std", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json", "gzip", "brotli", "zstd", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
mimalloc = { version = "0.1", default-features = false }
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
eventsource-stream = "0.2"
croner = "3"
hex = "0.4"
getrandom = "0.3"
oauth2 = { version = "5", default-features = false }
open = "5"
ratatui = "0.30"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
futures = "0.3"
zstd = { version = "0.14", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
thiserror = "2"
anyhow = "1"
arc-swap = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
use_self = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
derive_partial_eq_without_eq = "warn"
iter_with_drain = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
str_to_string = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
self_named_module_files = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
